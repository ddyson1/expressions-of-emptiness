    <section class="poem" aria-label="poem">
      <p>the room keeps the shape of you<br>the way a glass keeps water gone &mdash;<br><em>curved around an absence,</em><br>still, and cold, and clear.</p>
      <p>i have learned the weight of quiet.<br>it is not nothing.<br>it is everything,<br>held very carefully, and empty.</p>
    </section>
