<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>expressions of emptiness</title>
  <meta name="description" content="A communal notebook of poetry. Turn the pages; fill one.">

  <meta property="og:title" content="expressions of emptiness">
  <meta property="og:description" content="A communal notebook of poetry. Turn the pages; fill one.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://expressions-of-emptiness.com">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/Swinger.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="book-wrap">
    <div class="book-col">
      <div id="book"></div>
    </div>
  </div>

  <script src="js/page-flip.browser.js"></script>
  <script>
  (function () {
    /* ---- config ---- */
    var WORKER_URL = "";   /* set to the Cloudflare Worker origin to open submissions */
    var qs = new URLSearchParams(location.search);
    var wanted = (qs.get('notebook') || '001').replace(/[^0-9]/g, '') || '001';
    var isArchiveView = qs.has('notebook');

    var book = document.getElementById('book');
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ---- tiny DOM helpers ---- */
    function el(tag, cls, text) {
      var d = document.createElement(tag);
      if (cls) d.className = cls;
      if (text != null) d.textContent = text;
      return d;
    }
    function page(cls) {
      var p = el('div', 'page' + (cls ? ' ' + cls : ''));
      var inner = el('div', 'inner');
      p.appendChild(inner);
      return { p: p, inner: inner };
    }

    /* ---- build pages from data ---- */
    function build(nb, archive) {
      var frag = document.createDocumentFragment();

      /* cover */
      var cover = page('cover');
      var mark = el('div', 'mark');
      ['expressions', 'of', 'emptiness'].forEach(function (w, i) {
        var s = el('span', i === 1 ? 'of' : null, w);
        mark.appendChild(s);
      });
      cover.inner.appendChild(mark);
      cover.inner.appendChild(el('p', 'open-hint',
        isArchiveView ? 'notebook ' + nb.id + ' — archived' : 'notebook ' + nb.id + ' — by dd & strangers'));
      frag.appendChild(cover.p);

      /* entry slots */
      var byN = {};
      (nb.entries || []).forEach(function (e) { byN[e.n] = e; });
      var firstBlank = null;
      for (var n = 1; n <= nb.pages; n++) {
        var e = byN[n];
        if (e) {
          var pg = page(n % 2 === 0 ? '-back' : null);
          var poem = el('div', 'poem');
          e.lines.forEach(function (line) {
            var dim = line.charAt(0) === '~';
            var p = el('p', dim ? 'dim' : null, dim ? line.slice(1) : line);
            poem.appendChild(p);
          });
          pg.inner.appendChild(poem);
          var sig = el('p', 'sig', '— ' + (e.name || 'anonymous'));
          pg.inner.appendChild(sig);
          pg.inner.appendChild(el('span', 'folio', String(n)));
          frag.appendChild(pg.p);
        } else if (firstBlank === null && !isArchiveView) {
          /* the write-in page */
          firstBlank = n;
          var fp = page('formpage');
          fp.inner.appendChild(el('p', 'formkick', 'this page is yours'));
          var form = el('form', 'fillform');
          form.id = 'fillform';
          form.innerHTML =
            '<textarea id="ftext" maxlength="600" rows="7" placeholder="leave what the empty hours gave you&#8230;" required></textarea>' +
            '<input id="fname" type="text" maxlength="40" placeholder="signed (optional)" autocomplete="off">' +
            '<input id="fhp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-5000px">' +
            '<div class="formrow"><span class="fcount"><span id="fc">0</span>/600</span>' +
            '<button type="submit" id="fgo">offer it</button></div>' +
            '<p class="fnote" id="fnote"></p>';
          fp.inner.appendChild(form);
          fp.inner.appendChild(el('span', 'folio', String(n)));
          frag.appendChild(fp.p);
        } else {
          var bl = page('blankpage' + (n % 2 === 0 ? ' -back' : ''));
          bl.inner.appendChild(el('p', 'waiting', isArchiveView ? '' : 'still empty'));
          bl.inner.appendChild(el('span', 'folio', String(n)));
          frag.appendChild(bl.p);
        }
      }

      /* about */
      var ab = page(null);
      var abPoem = el('div', 'poem about');
      abPoem.appendChild(el('p', 'dim', 'about'));
      abPoem.appendChild(el('p', null, 'a communal notebook of poetry.'));
      var ap = el('p'); ap.innerHTML = 'anyone may fill a page.<br>when all ' + nb.pages + ' are full,<br>the notebook is shelved<br>and a blank one begins.';
      abPoem.appendChild(ap);
      ab.inner.appendChild(abPoem);
      ab.inner.appendChild(el('span', 'folio', 'about'));
      frag.appendChild(ab.p);

      /* shelf */
      var sh = page(null);
      var shPoem = el('div', 'poem about');
      shPoem.appendChild(el('p', 'dim', 'the shelf'));
      if (archive.notebooks && archive.notebooks.length) {
        var list = el('div', 'shelf');
        archive.notebooks.forEach(function (a) {
          var link = el('a', null, 'notebook ' + a.id + ' — ' + (a.filled || ''));
          link.href = '?notebook=' + a.id;
          list.appendChild(link);
        });
        shPoem.appendChild(list);
      } else {
        shPoem.appendChild(el('p', null, 'no notebooks filled yet.'));
        shPoem.appendChild(el('p', 'dim', 'this one is the first.'));
      }
      if (isArchiveView) {
        var back = el('a', 'backlink', 'return to the open notebook');
        back.href = location.pathname;
        shPoem.appendChild(back);
      }
      sh.inner.appendChild(shPoem);
      sh.inner.appendChild(el('span', 'folio', 'shelf'));
      frag.appendChild(sh.p);

      /* endpage */
      var end = page('endpage');
      var nav2 = el('nav');
      var mail = el('a', null, 'contact');
      mail.href = 'mailto:dyson@plotflow.io';
      nav2.appendChild(mail);
      end.inner.appendChild(nav2);
      end.inner.appendChild(el('p', 'fin', 'expressions of emptiness — by dd & strangers'));
      frag.appendChild(end.p);

      book.appendChild(frag);
      return firstBlank;
    }

    /* ---- fetch data, then boot ---- */
    Promise.all([
      fetch('data/notebook-' + wanted + '.json').then(function (r) {
        if (!r.ok) throw new Error('no notebook ' + wanted);
        return r.json();
      }),
      fetch('data/archive.json').then(function (r) { return r.ok ? r.json() : { notebooks: [] }; })
    ]).then(function (res) {
      var nb = res[0], archive = res[1];
      var firstBlank = build(nb, archive);

      var pageFlip = new St.PageFlip(book, {
        width: 375, height: 500,
        size: 'stretch',
        minWidth: 260, maxWidth: 520,
        minHeight: 340, maxHeight: 700,
        usePortrait: true,
        showCover: true,
        maxShadowOpacity: 0.12,
        flippingTime: reduced ? 1 : 800,
        mobileScrollSupport: false,
        showPageCorners: true,
        disableFlipByClick: true   /* clicks focus content (the form); corner-drag still turns */
      });
      pageFlip.loadFromHTML(document.querySelectorAll('.page'));
      window.pageFlip = pageFlip;

      var last = pageFlip.getPageCount() - 1;

      /* keyboard */
      document.addEventListener('keydown', function (e) {
        if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
        if (e.key === 'ArrowRight' || e.key === ' ') { pageFlip.flipNext(); e.preventDefault(); }
        else if (e.key === 'ArrowLeft') { pageFlip.flipPrev(); e.preventDefault(); }
      });

      /* side tabs — index tabs on the fore-edge, like a real notebook */
      var tabs = [
        { label: 'cover', at: 0 },
        { label: 'poems', at: 1 }
      ];
      if (firstBlank !== null) tabs.push({ label: 'write', at: firstBlank, cls: 'write' });
      tabs.push(
        { label: 'about', at: nb.pages + 1 },
        { label: 'shelf', at: nb.pages + 2 },
        { label: 'end', at: last }
      );

      var rail = el('nav', 'tabs');
      rail.setAttribute('aria-label', 'sections');
      var btns = tabs.map(function (t) {
        var b = el('button', t.cls || null, t.label);
        b.type = 'button';
        b.addEventListener('click', function () {
          pageFlip.turnToPage(t.at);   /* flip() can't span many pages */
          setActive(pageFlip.getCurrentPageIndex());
        });
        rail.appendChild(b);
        return b;
      });
      document.querySelector('.book-col').appendChild(rail);

      function setActive(i) {
        var best = 0;
        tabs.forEach(function (t, k) { if (i >= t.at) best = k; });
        btns.forEach(function (b, k) { b.classList.toggle('active', k === best); });
      }
      setActive(0);
      pageFlip.on('flip', function (e) { setActive(e.data); });

      /* form */
      var form = document.getElementById('fillform');
      if (form) {
        /* the flip engine listens for drags on the whole book — pointer
           activity that starts inside the form belongs to the form */
        ['pointerdown', 'mousedown', 'touchstart'].forEach(function (evName) {
          form.addEventListener(evName, function (e) { e.stopPropagation(); });
        });
        var ftext = document.getElementById('ftext'),
            fname = document.getElementById('fname'),
            fhp = document.getElementById('fhp'),
            fc = document.getElementById('fc'),
            fgo = document.getElementById('fgo'),
            fnote = document.getElementById('fnote');
        ftext.addEventListener('input', function () { fc.textContent = ftext.value.length; });
        form.addEventListener('submit', function (ev) {
          ev.preventDefault();
          if (fhp.value) return; /* honeypot */
          if (!WORKER_URL) {
            fnote.textContent = 'the pen is still being made — submissions open soon.';
            return;
          }
          fgo.disabled = true; fnote.textContent = 'offering…';
          fetch(WORKER_URL + '/submit', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ text: ftext.value.trim(), name: fname.value.trim(), notebook: nb.id })
          }).then(function (r) { return r.json(); }).then(function (out) {
            fnote.textContent = out.ok
              ? 'received. it will appear once it has been read.'
              : (out.error || 'something went wrong — try again later.');
            if (out.ok) { ftext.value = ''; fname.value = ''; fc.textContent = '0'; }
          }).catch(function () {
            fnote.textContent = 'something went wrong — try again later.';
          }).finally(function () { fgo.disabled = false; });
        });
      }
    }).catch(function (err) {
      book.textContent = 'could not open the notebook. (' + err.message + ')';
      book.className = 'bookerror';
    });
  })();
  </script>

</body>
</html>
